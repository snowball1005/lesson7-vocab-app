<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>중2 과학 공부방 — 기말고사</title><style>

</style></head><body><header><h1>🔬 나의 중2 과학 공부방</h1><p>기초 개념부터 · 하루 25분 · 앱 + 인쇄 학습 · 간격 복습</p></header><div class="wrap"><nav class="panel noprint" id="nav"></nav><main class="panel" id="main"></main></div><footer class="noprint">앱은 계정 없이 사용할 수 있습니다. 학습 기록은 현재 브라우저에만 저장됩니다. 다른 기기로 이동할 때는 백업 파일을 내려받으세요.</footer><script>
const START_UNITS=[{"id":"u1","title":"Ⅵ-1 소화와 순환 · 첫 주","days":[{"id":"d1","unit":"u1","title":"영양소는 왜 필요할까?","sub":"6가지 영양소의 이름과 역할","story":"학교에서 달리려면 에너지가 필요하고, 성장하려면 몸을 만들 재료가 필요해요. 음식에는 이런 일을 돕는 영양소가 들어 있어요.","analogy":"우리 몸은 집과 같아요. 에너지는 전기, 단백질은 건축 재료, 바이타민과 무기염류는 시설을 잘 작동시키는 관리 역할을 떠올려 보세요. 비유는 이해를 돕기 위한 것이에요.","steps":["영양소 6가지는 탄수화물·단백질·지방·무기염류·바이타민·물이에요.","탄수화물·단백질·지방은 에너지원으로 이용될 수 있어요.","무기염류·바이타민·물은 에너지원으로 이용되지 않아요."],"terms":[["탄수화물","주요 에너지원"],["단백질","근육·머리카락 등 몸 구성"],["지방","에너지 저장과 몸 구성"],["무기염류","뼈 구성과 기능 조절"],["바이타민","몸의 기능 조절"],["물","물질 운반과 몸 구성"]],"qs":[{"q":"교과서에서 말하는 영양소의 종류는 몇 가지일까요?","a":1,"opts":["4가지","6가지","8가지"],"why":"탄수화물, 단백질, 지방, 무기염류, 바이타민, 물의 6가지예요."},{"q":"주요 에너지원으로 사용되는 영양소는?","a":0,"opts":["탄수화물","바이타민","물"],"why":"탄수화물은 생명활동의 주요 에너지원이에요."},{"q":"몸의 기능을 조절하지만 에너지원으로 이용되지 않는 것은?","a":2,"opts":["지방","탄수화물","바이타민"],"why":"바이타민은 에너지원이 아니라 몸의 기능을 조절해요."},{"q":"근육이나 머리카락을 만드는 데 중요한 영양소는?","a":1,"opts":["물","단백질","녹말 검출 시약"],"why":"단백질은 몸의 구성 성분이에요."},{"q":"영양소 중 물의 역할로 알맞은 것은?","a":0,"opts":["영양소와 노폐물 운반","녹말을 직접 검출","산소를 만드는 것"],"why":"물은 몸을 구성하며 다양한 물질의 운반에 관여해요."}],"visual":"food"},{"id":"d2","unit":"u1","title":"탄수화물·단백질·지방 구별하기","sub":"3대 영양소와 음식의 예","story":"밥과 감자를 먹으면 탄수화물을, 달걀과 두부를 먹으면 단백질을, 버터와 땅콩을 먹으면 지방을 떠올려요. 실제 음식에는 영양소가 여러 종류 함께 들어갈 수 있어요.","analogy":"탄수화물은 자주 쓰는 연료, 지방은 저장해 둔 연료, 단백질은 몸을 만드는 재료처럼 떠올려 보세요.","steps":["탄수화물: 밥·빵·감자에 많이 들어 있어요.","단백질: 살코기·생선·두부·달걀에 많아요.","지방: 버터·땅콩 등에 많고 에너지 저장 및 세포막 구성에 관여해요."],"terms":[["밥·빵·감자","탄수화물 예시"],["달걀·두부·생선","단백질 예시"],["버터·땅콩","지방 예시"],["3대 영양소","탄수화물·단백질·지방"]],"qs":[{"q":"교과서의 3대 영양소는?","a":0,"opts":["탄수화물·단백질·지방","물·무기염류·바이타민","녹말·엿당·포도당"],"why":"3대 영양소는 탄수화물, 단백질, 지방이에요."},{"q":"밥과 감자에 특히 많이 들어 있는 영양소는?","a":2,"opts":["단백질","바이타민","탄수화물"],"why":"밥과 감자에는 탄수화물이 많이 들어 있어요."},{"q":"달걀, 두부, 생선과 연결하기 알맞은 것은?","a":1,"opts":["지방만 존재","단백질이 풍부","물은 없음"],"why":"단백질을 많이 포함하지만 다른 영양소도 함께 있을 수 있어요."},{"q":"에너지를 저장하며 세포막 등의 성분인 것은?","a":0,"opts":["지방","바이타민","물"],"why":"지방은 에너지 저장과 몸 구성에 쓰여요."},{"q":"다음 중 에너지원으로 이용되지 않는 영양소끼리 묶은 것은?","a":2,"opts":["탄수화물·지방","단백질·지방","물·바이타민"],"why":"물과 바이타민은 에너지원으로 이용되지 않아요."}],"visual":"food"},{"id":"d3","unit":"u1","title":"영양소 검출 색깔 기억하기","sub":"시약과 반응 결과","story":"어떤 음식에 어떤 영양소가 있는지 눈으로 볼 수 있을까요? 특정 시약을 넣으면 색이 달라져 영양소가 들어 있는지 조사할 수 있어요.","analogy":"검출 시약은 특정 영양소를 알아보는 색깔 탐정이에요. 탐정마다 찾는 대상과 나타나는 색이 달라요.","steps":["녹말 + 아이오딘-아이오딘화 칼륨 용액 → 청람색","단백질 + 뷰렛 용액 → 보라색","포도당·엿당 + 베네딕트 용액, 가열 → 황적색","지방 + 수단 Ⅲ 용액 → 선홍색"],"terms":[["아이오딘 반응","녹말 → 청람색"],["뷰렛 반응","단백질 → 보라색"],["베네딕트 반응","당 + 가열 → 황적색"],["수단 Ⅲ 반응","지방 → 선홍색"]],"qs":[{"q":"녹말이 있을 때 청람색으로 변하는 시약은?","a":0,"opts":["아이오딘-아이오딘화 칼륨 용액","뷰렛 용액","베네딕트 용액"],"why":"아이오딘 반응은 녹말 검출에 이용돼요."},{"q":"단백질을 검출하면 나타나는 색은?","a":2,"opts":["황적색","청람색","보라색"],"why":"뷰렛 반응에서 단백질이 있으면 보라색으로 변해요."},{"q":"베네딕트 반응으로 확인하는 것은?","a":1,"opts":["지방","포도당이나 엿당","단백질"],"why":"베네딕트 용액은 포도당이나 엿당 검출에 써요. 가열이 필요해요."},{"q":"지방을 검출하는 용액은?","a":0,"opts":["수단 Ⅲ 용액","뷰렛 용액","아이오딘 용액"],"why":"지방은 수단 Ⅲ 반응에서 선홍색을 보여요."},{"q":"베네딕트 반응에 필요한 과정은?","a":2,"opts":["얼리기","소금 넣기","중탕하여 가열하기"],"why":"자료에서 베네딕트 용액을 넣고 중탕하여 색 변화를 확인해요."}],"visual":"reagent"},{"id":"d4","unit":"u1","title":"영양소 검출 실험 읽기","sub":"관찰 결과와 의미 연결하기","story":"색이 바뀌었다는 사실을 기억하는 것보다, 왜 바뀌었는지 해석하는 연습이 중요해요. 비교 실험에서 어떤 시약을 썼고 무슨 색이 나왔는지 읽어보세요.","analogy":"시약은 질문을 하는 탐정, 색 변화는 음식물이 보내는 대답이라고 생각해 보세요.","steps":["아이오딘 반응 청람색 → 녹말이 검출되었다는 뜻","뷰렛 반응 보라색 → 단백질이 검출되었다는 뜻","베네딕트 반응 황적색 → 당이 검출되었다는 뜻","한 음식에서 여러 반응이 나타날 수 있어요."],"terms":[["실험 관찰","어떤 색이 나타나는지 보기"],["실험 해석","색 변화가 의미하는 영양소 설명"],["대조 비교","증류수와 음식물 희석액 비교"]],"qs":[{"q":"어떤 음식이 뷰렛 용액에서 보라색을 띠었다면?","a":1,"opts":["지방 검출","단백질 검출","녹말 검출"],"why":"보라색은 단백질이 검출되었다는 뜻이에요."},{"q":"아이오딘 용액에서 청람색으로 변했다면?","a":0,"opts":["녹말이 있다","단백질이 있다","지방이 있다"],"why":"아이오딘 반응은 녹말 확인에 이용돼요."},{"q":"베네딕트 용액을 넣고 가열했더니 황적색이 되었다면?","a":2,"opts":["물만 있다","지방만 있다","당이 검출되었다"],"why":"베네딕트 반응의 황적색은 포도당이나 엿당 등의 당 검출을 뜻해요."},{"q":"음식물 하나에서 두 가지 이상의 검출 반응이 나타날 수 있을까요?","a":0,"opts":["그럴 수 있다","절대로 없다","실험이 항상 실패한 것이다"],"why": function overview(){let completed=allDays().filter(d=>state.progress[d.id]?.done).length;let next=allDays().find(d=>!state.progress[d.id]?.done)||allDays().at(-1);let due=dueItems().length;return `<span class="pill">매일 25분 루틴</span><h2>오늘도 조금씩, 오래 기억해요 🌱</h2><p class="muted">이전 내용 5분 → 새로운 개념 8분 → 확인 문제 7분 → 종이 학습지 5분</p><div class="grid"><div class="tile"><strong>전체 학습 진행</strong><p>${completed} / ${allDays().length}일 완료</p><div class="bar"><span style="width:${100*completed/Math.max(1,allDays().length)}%"></span></div></div><div class="tile"><strong>오늘 복습할 문제</strong><p><b style="font-size:28px">${due}</b>개</p><button class="btn secondary" onclick="go('review')">복습하러 가기</button></div></div><h3>오늘의 추천 학습</h3><div class="tile"><div class="tag">${escapeHTML(next.sub)}</div><h3>${escapeHTML(next.title)}</h3><p>쉬운 설명 + 개념 그림 + 확인 문제 ${next.qs.length}개 + 인쇄 학습</p><button class="btn" onclick="openDay('${next.id}')">공부 시작하기 →</button></div><h3>단원 추가 방식</h3><p>새 시험 범위는 관리 메뉴에서 JSON 형식으로 추가할 수 있어요. 단원을 추가해도 기존 학습 기록과 복습 예약은 유지됩니다.</p>`}
let qpos=0,answers={};function lesson(){let d=getDay(state.day)||allDays()[0];let prog=state.progress[d.id]||{};return `<div class="row spaced"><span class="pill">${escapeHTML(d.title)}</span><button class="btn secondary noprint" onclick="go('units')">단원 목록</button></div><h2>${escapeHTML(d.sub)}</h2><div class="drawing">${illustration(d.visual)}</div><h3>① 쉽고 짧은 개념 이야기</h3><div class="lesson">${escapeHTML(d.story)}</div><div class="analogy"><b>💡 쉬운 비유</b><p>${escapeHTML(d.analogy)}</p></div><h3>② 꼭 알아야 할 핵심 개념</h3><ol>${d.steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><h3>③ 앞면·뒷면 기억 카드</h3><div id="cards">${d.terms.map((t,i)=>`<div class="term"><strong>${escapeHTML(t[0])}</strong><span id="term${i}"><button class="btn secondary" onclick="document.getElementById('term${i}').innerText=${JSON.stringify(t[1])}">정답 보기</button></span></div>`).join('')}</div><h3>④ 수준별 문제</h3><div id="quiz">${quizHTML(d)}</div><hr class="divider"><div class="row"><button class="btn secondary" onclick="printDay('${d.id}')">🖨️ 오늘 학습지 인쇄</button><span class="muted small">학습 완료: ${prog.done?'완료 ✅':'아직'}</span></div>`}
function quizHTML(d){let t=d.qs[qpos]||d.qs[0];let chosen=answers[qpos];return `<div class="row spaced"><span class="tag">문제 ${qpos+1} / ${d.qs.length}</span><span class="muted subtle">${escapeHTML(t.level||"기초")} · 풀고 정답 확인하기</span></div><h3>${escapeHTML(t.q)}</h3><div class="answers">${t.opts.map((o,i)=>`<button class="${chosen===i?'chosen':''} ${chosen!==undefined&&i===t.a?'correct':''}" onclick="choose(${i})">${i+1}. ${escapeHTML(o)}</button>`).join('')}</div>${chosen!==undefined?`<div class="explain ${chosen===t.a?'':'bad'}"><b>${chosen===t.a?'✅ 정답이에요!':'🔎 다시 이해해 보세요.'}</b><p>${escapeHTML(t.why)}</p><small>${chosen===t.a?'이 문제는 간격을 두고 다시 확인할게요.':'틀린 문제는 내일 다시 나옵니다.'}</small></div>`:''}<div class="row" style="margin-top:12px"><button class="btn secondary" ${qpos===0?'disabled':''} onclick="moveQuiz(-1)">이전</button><button class="btn" ${chosen===undefined?'disabled':''} onclick="moveQuiz(1)">${qpos===d.qs.length-1?'결과 확인':'다음 문제'}</button></div>`}
function choose(i){let d=getDay(state.day),t=d.qs[qpos];if(answers[qpos]!==undefined)return;answers[qpos]=i;let key=d.id+':'+qpos,old=state.queue[key]||{};let correct=i===t.a;recordAnswer(key,correct,'first',old);let nextStage=correct?Math.min((old.stage??-1)+1,3):0;state.queue[key]={stage:nextStage,due:addDays(correct?stageIntervals[nextStage]:1),misses:(old.misses||0)+(correct?0:1),attempts:(old.attempts||0)+1,lastCorrect:correct,lastAt:new Date().toISOString()};persist();$('#quiz').innerHTML=quizHTML(d)}
function moveQuiz(n){let d=getDay(state.day);if(n===1&&qpos===d.qs.length-1){let right=d.qs.filter((q,i)=>answers[i]===q.a).length;state.progress[d.id]={done:true,score:right,total:d.qs.length,date:nowDay()};persist();$('#quiz').innerHTML=`<div class="tile"><h2>이번 학습 완료 🎉</h2><p><b>${right}/${d.qs.length}</b>문제 정답</p><p>틀린 문제는 내일부터 다시 복습하도록 예약되었어요. 마지막으로 책을 덮고 설명해 보세요.</p><button class="btn" onclick="go('home')">홈으로 돌아가기</button> <button class="btn secondary" onclick="printDay('${d.id}')">학습지 인쇄</button></div>`;return}qpos=Math.max(0,Math.min(d.qs.length-1,qpos+n));$('#quiz').innerHTML=quizHTML(d)}
function dueItems(){return Object.entries(state.queue).filter(([k,v])=>v.due<=nowDay()).map(([key,v])=>({key,...v})).filter(it=>{let [id,i]=it.key.split(':');return Boolean(getDay(id)?.qs[Number(i)])})}
function reviewPage(){let due=dueItems(),later=Object.entries(state.queue).filter(([k,v])=>v.due>nowDay()).sort((a,b)=>a[1].due.localeCompare(b[1].due));return `<h2>🔁 내 기억을 튼튼하게</h2><p class="muted">오답은 다음 날부터, 정답은 1일 → 3일 → 7일 → 14일 간격으로 확인해요. 이 간격은 학습을 위한 기본 규칙이며 아이의 성취에 따라 조정할 수 있어요.</p><p><span class="pill">오늘 복습 ${due.length}개</span> &nbsp; 다음 복습 예정 ${later.length}개</p>${due.length?due.map(it=>{let [id,idx]=it.key.split(':'),d=getDay(id),q=d.qs[+idx];return `<div class="review due" id="rev-${id}-${idx}"><b>${escapeHTML(d.title)} · 문제 ${+idx+1}</b><p>${escapeHTML(q.q)}</p><div class="answers">${q.opts.map((o,i)=>`<button onclick="reviewChoose('${it.key}',${i})">${i+1}. ${escapeHTML(o)}</button>`).join('')}</div></div>`}).join(''):`<div class="tile">오늘 예정된 복습 문제가 없어요. 새로운 개념을 공부하거나 이미 배운 내용을 말로 설명해 보세요.</div>`}<h3>다음 복습 예약</h3>${later.slice(0,12).map(([key,v])=>`<div class="term"><span>${escapeHTML(getDay(key.split(':')[0])?.title||'추가 단원')} · ${Number(key.split(':')[1])+1}번</span><b>${v.due}</b></div>`).join('')||'<p class="muted">아직 예약이 없습니다.</p>'}`}
function reviewChoose(key,i){let [id,idx]=key.split(':'),q=getDay(id).qs[+idx];let correct=i===q.a;let old=state.queue[key]||{},stage=correct?Math.min((old.stage??-1)+1,3):0;recordAnswer(key,correct,'review',old);state.queue[key]={stage,due:addDays(correct?stageIntervals[stage]:1),misses:(old.misses||0)+(correct?0:1),attempts:(old.attempts||0)+1,lastCorrect:correct,lastAt:new Date().toISOString()};persist();let box=document.getElementById('rev-'+id+'-'+idx);box.innerHTML=`<b>${correct?'✅ 정답!':'🔎 다시 학습해요.'}</b><p>${escapeHTML(q.why)}</p><p class="muted">다음 복습일: ${state.queue[key].due}</p><button class="btn secondary" onclick="go('review')">복습 목록 새로고침</button>`}
function unitsPage(){return `<h2>📘 단원별 학습</h2>${state.units.map(u=>`<h3>${escapeHTML(u.title)}</h3><p class="muted small">${escapeHTML(u.source||'추가된 학습 단원')}</p><div class="grid">${u.days.map(d=>`<div class="tile"><div class="row spaced"><span class="tag">${escapeHTML(d.id)}</span><span class="small">${state.progress[d.id]?.done?'✅ 완료':'미학습'}</span></div><b>${escapeHTML(d.title)}</b><p class="muted small">${escapeHTML(d.sub)}</p><button class="btn secondary" onclick="openDay('${d.id}')">학습 열기</button></div>`).join('')}</div>`).join('')}`}
let printSelected='d1',showAnswers=false;function printPage(){return `<section id="printview"><div class="noprint"><h2>🖨️ 하루 한 장 학습지</h2><p class="muted">날짜를 선택하고 프린트하면 문제 풀이용 종이 학습지가 나옵니다.</p><select id="printSelect" onchange="printSelected=this.value;render()">${allDays().map(d=>`<option value="${d.id}" ${printSelected===d.id?'selected':''}>${escapeHTML(d.title)}</option>`).join('')}</select><p><label><input type="checkbox" ${showAnswers?'checked':''} onchange="showAnswers=this.checked;render()"> 보호자용 정답과 해설 포함</label></p><button class="btn" onclick="window.print()">인쇄 / PDF로 저장</button><hr class="divider"></div>${worksheet(printSelected,showAnswers)}</section>`}
function worksheet(id,include){let d=getDay(id)||allDays()[0];return `<div class="worksheet"><h2>중2 과학 · 하루 25분 학습지</h2><div class="row spaced"><b>${escapeHTML(d.title)}</b><span>날짜: ______ / 이름: __________</span></div><hr><h3>① 전날 복습: 알고 있는 영양소 3개 쓰기</h3><div class="line"></div><h3>② 오늘의 핵심 정리</h3><ol>${d.steps.map(s=>`<li>${escapeHTML(s)}</li>`).join('')}</ol><h3>③ 기억 확인: 정답에 동그라미</h3>${d.qs.map((q,i)=>`<div style="break-inside:avoid;margin:12px 0"><b>${i+1}. ${escapeHTML(q.q)}</b><p>${q.opts.map((o,k)=>`${k+1}) ${escapeHTML(o)}`).join(' &nbsp; ')}</p></div>`).join('')}<h3>④ 책을 덮고 오늘 배운 내용 설명하기</h3><div class="line"></div><div class="line"></div><h3>⑤ 스스로 평가하기</h3><p>□ 혼자 설명 가능 &nbsp; □ 힌트가 있으면 가능 &nbsp; □ 다시 배워야 함</p>${include?`<hr><h3>보호자용 정답·해설</h3>${d.qs.map((q,i)=>`<p>${i+1}. ${q.a+1}번 — ${escapeHTML(q.why)}</p>`).join('')}`:''}</div>`}

function parentPage(){
 let days=allDays(),done=days.filter(d=>state.progress[d.id]?.done),records=state.history||[],first=records.filter(x=>x.kind==='first'),review=records.filter(x=>x.kind==='review');
 let pct=a=>a.length?Math.round(a.filter(x=>x.correct).length/a.length*100)+'%':'기록 없음';
 let delayed=review.filter(x=>x.gapDays!==null&&x.gapDays>=7);

 let perDay=days.map(d=>{let recordsFor=records.filter(x=>x.key.startsWith(d.id+':'));let reviewFor=review.filter(x=>x.key.startsWith(d.id+':'));return {d,recordsFor,reviewFor,wrong:recordsFor.filter(x=>!x.correct).length}});
 return `<h2>📊 학부모 학습 분석</h2><p class="muted">개념별 이해도는 객관식 정답 기록을 바탕으로 한 추정치입니다. 실제로 이해했는지는 종이 학습지와 말로 설명하기를 함께 확인해 주세요.</p>
 <div class="grid"><div class="tile"><span class="muted">학습 완료</span><h2>${done.length}/${days.length}일</h2></div><div class="tile"><span class="muted">새 개념 최초 정답률</span><h2>${pct(first)}</h2></div><div class="tile"><span class="muted">누적 복습 정답률</span><h2>${pct(review)}</h2></div><div class="tile"><span class="muted">7일 이상 뒤 기억 유지율*</span><h2>${pct(delayed)}</h2></div></div>
 <p class="muted small">* 기억 유지율은 마지막 풀이로부터 7일 이상 지난 복습에서의 정답 비율입니다. 장기기억을 직접 측정한 값은 아니며, 표본이 없으면 '기록 없음'으로 표시합니다.</p>
 <h3>소주제별 성취와 오답률</h3>
 ${perDay.map(({d,recordsFor,reviewFor,wrong})=>`<div class="tile" style="margin-bottom:10px"><div class="row spaced"><b>${escapeHTML(d.title)}</b><span class="tag">${recordsFor.length?Math.round((recordsFor.length-wrong)/recordsFor.length*100)+'% 정답':'미학습'}</span></div><div class="bar"><span style="width:${recordsFor.length?100*(recordsFor.length-wrong)/recordsFor.length:0}%"></span></div><p class="muted small">오답 ${wrong}회 / 전체 응답 ${recordsFor.length}회 · 복습 응답 ${reviewFor.length}회</p></div>`).join('')}
 <h3>취약 개념 자동 추출</h3><p class="muted">한 번이라도 틀린 문항을 오답 횟수순으로 보여줍니다. 오늘 복습 대상에 들어온 문항은 '누적 복습'에서 자동으로 다시 풀 수 있습니다.</p>
 ${weak.length?weak.slice(0,25).map(([key,v])=>{let [id,idx]=key.split(':'),d=getDay(id),q=d?.qs[+idx];return q?`<div class="term"><span>${escapeHTML(d.title)} · ${escapeHTML(q.q)}<br><small class="muted">오답 ${v.misses}회 · 다음 복습 ${escapeHTML(v.due)}</small></span><button class="btn secondary" onclick="openDay('${id}')">개념 보기</button></div>`:''}).join(''):'<div class="tile">현재 기록된 오답이 없습니다.</div>'}
 <h3>최근 학습 기록</h3>${records.slice(-15).reverse().map(r=>{let [id,idx]=r.key.split(':');let d=getDay(id);return `<div class="term"><span>${escapeHTML(d?.title||id)} · ${r.kind==='review'?'복습':'첫 학습'} · ${r.correct?'정답':'오답'}</span><span>${escapeHTML(r.at.slice(0,10))}</span></div>`}).join('')||'<p class="muted">아직 기록이 없습니다.</p>'}
 <p class="muted small">개인별 서버 저장·학부모 원격 동기화는 지원하지 않습니다. 브라우저 기록은 백업해 주세요.</p>`
}
function managePage(){return `<h2>➕ 시험 범위 계속 추가하기</h2><p>이 앱은 새 단원을 덧붙일 수 있도록 설계되었습니다. 아래 입력창에 새 단원의 JSON을 넣거나 파일로 불러오면 기존 단원과 학습 기록을 유지한 채 추가할 수 있어요.</p><div class="tile"><b>1. 현재 기록 백업</b><p class="muted small">학습을 다른 기기로 옮기기 전에 반드시 백업하세요.</p><button class="btn secondary" onclick="backup()">전체 학습 백업 JSON 저장</button> <label class="btn secondary" style="display:inline-block">백업 파일 복원<input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label></div><div class="tile" style="margin-top:12px"><b>2. 새로운 단원 추가</b><p class="muted small">구조: {"id":"u2","title":"새 단원","days":[{"id":"u2d1","title":"...","sub":"...","story":"...","analogy":"...","steps":["..."],"terms":[["용어","뜻"]],"qs":[{"q":"질문","opts":["선택1","선택2","선택3"],"a":0,"why":"해설"}],"visual":"food"}]}</p><textarea id="newUnit" placeholder="여기에 새 단원 JSON을 붙여 넣으세요."></textarea><p><button class="btn" onclick="importUnit()">새 단원 추가하기</button></p></div><div class="tile" style="margin-top:12px"><b>3. 모든 단원 데이터 다운로드</b><p>교사가 다음 단원 문제를 추가하거나 수정할 때 사용할 수 있어요.</p><button class="btn secondary" onclick="downloadJSON(state.units,'science_units.json')">단원 데이터 저장</button></div><p class="muted small">주의: 이 파일은 정적 HTML 앱으로 서버나 계정 연결이 없습니다. 브라우저 저장 공간을 지우면 기록이 사라질 수 있으니 백업 기능을 활용하세요.</p>`}
function downloadJSON(obj,name){let a=document.createElement('a'),blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}function backup(){downloadJSON({format:'science_mid2_backup_v1',state},'science_backup_'+nowDay()+'.json')}
async function restore(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='science_mid2_backup_v1'||!Array.isArray(obj.state?.units))throw Error('이 앱의 백업 형식이 아닙니다.');if(!confirm('현재 학습 기록을 백업 파일의 내용으로 교체할까요?'))return;state=obj.state;persist();go('home');alert('백업을 복원했습니다.')}catch(e){alert('복원 실패: '+e.message)}}
function importUnit(){try{let u=JSON.parse($('#newUnit').value);if(!u.id||!u.title||!Array.isArray(u.days)||!u.days.length)throw Error('id, title, days가 필요해요.');if(state.units.some(x=>x.id===u.id))throw Error('이미 같은 ID의 단원이 있어요.');for(let d of u.days){if(!d.id||!d.title||!Array.isArray(d.steps)||!Array.isArray(d.terms)||!Array.isArray(d.qs)||!d.qs.every(q=>typeof q.q==='string'&&Array.isArray(q.opts)&&Number.isInteger(q.a)&&q.a>=0&&q.a<q.opts.length&&typeof q.why==='string'))throw Error('일차 구성과 문제 형식을 확인해 주세요.');if(allDays().some(x=>x.id===d.id))throw Error('이미 같은 일차 ID가 있어요: '+d.id);d.unit=u.id}state.units.push(u);persist();go('units');alert('새 단원을 추가했습니다.')}catch(e){alert('단원 추가 실패: '+e.message)}}
function render(){nav();$('#main').innerHTML=state.page==='home'?overview():state.page==='lesson'?lesson():state.page==='units'?unitsPage():state.page==='review'?reviewPage():state.page==='print'?printPage():state.page==='parent'?parentPage():managePage()}
render();</script></body></html>
