    <button class="mode" onclick="startMode('defs')"><span>📖</span>영영풀이<small>정의 ↔ 단어</small></button>
    <button class="mode" onclick="startMode('expr')"><span>🔥</span>중요 표현<small>다의어·look 표현</small></button>
    <button class="mode" onclick="startMode('mixed')"><span>🎯</span>시험형 믹스<small>20문제 랜덤</small></button>
    <button class="mode" onclick="startSpelling()"><span>✍️</span>철자 5개<small>선택 사항</small></button>
    <button class="mode" onclick="startWrong()"><span>🔁</span>오답만<small>틀린 것 집중</small></button>
    <button class="mode" onclick="showList()"><span>📚</span>전체 목록<small>찾아보기·발음</small></button>
   </div>
   <div class="mission"><b>최소 노력 규칙:</b> 하루에는 <b>‘오늘의 10분’ 하나만</b> 끝내도 충분해요. 쓰기는 선택이고, 틀린 것은 앱이 다시 보여줍니다.</div>
 </section>`;
}
function getMisses(){return getObject(keyStore("misses"))}
function saveMiss(id){const m=getMisses();m[id]=(m[id]||0)+1;saveJSON(keyStore("misses"),m)}
function healMiss(id){const m=getMisses();if(m[id]){m[id]--;if(m[id]<=0)delete m[id];saveJSON(keyStore("misses"),m)}}
function recordSeen(id,correct){const s=getObject(keyStore("stats"));s[id]=s[id]||{seen:0,correct:0};s[id].seen++;if(correct)s[id].correct++;saveJSON(keyStore("stats"),s)}
function wordQs(){
 const d=DATA[lesson],out=[];
 d.words.forEach((x,i)=>{
  out.push({id:`${x.id}:a`,kind:"단어",prompt:x.w,answer:x.m,sub:"영어를 보고 뜻을 고르세요.",options:d.words.map(z=>z.m)});
  out.push({id:`${x.id}:b`,kind:"단어",prompt:x.m,answer:x.w,sub:"뜻을 보고 영어 단어를 고르세요.",options:d.words.map(z=>z.w),speak:x.w});
 });
 return out;
}
function phraseQs(){
 const d=DATA[lesson],out=[];
 d.phrases.forEach((x,i)=>{
  out.push({id:`${x.id}:a`,kind:"숙어",prompt:x.w,answer:x.m,sub:"숙어의 뜻을 고르세요.",options:d.phrases.map(z=>z.m)});
  out.push({id:`${x.id}:b`,kind:"숙어",prompt:x.m,answer:x.w,sub:"뜻에 맞는 숙어를 고르세요.",options:d.phrases.map(z=>z.w)});
 });
 return out;
}
function defQs(){
 const d=DATA[lesson],out=[];
 d.definitions.forEach((x,i)=>{
  out.push({id:`${x.id}:a`,kind:"영영풀이",prompt:x.d,answer:x.w,sub:"영영풀이에 해당하는 단어를 고르세요.",options:d.definitions.map(z=>z.w)});
  out.push({id:`${x.id}:b`,kind:"영영풀이",prompt:x.w,answer:x.d,sub:"단어에 맞는 영영풀이를 고르세요.",options:d.definitions.map(z=>z.d),speak:x.w});
 });
 return out;
}
function exprQs(){
 const d=DATA[lesson],out=[];
 d.expressions.forEach((x,i)=>{
  out.push({id:`${x.id}:a`,kind:x.group||"중요 표현",prompt:x.w,answer:x.m,sub:"중요 표현의 뜻을 고르세요.",options:d.expressions.map(z=>z.m)});
  out.push({id:`${x.id}:b`,kind:x.group||"중요 표현",prompt:x.m,answer:x.w,sub:"뜻에 맞는 표현을 고르세요.",options:d.expressions.map(z=>z.w)});
 });
 d.multi.forEach((x,i)=>x.examples.forEach((ex,j)=>{
   out.push({id:x.exampleIds[j],kind:"다의어",prompt:ex[0],answer:x.meanings[j],sub:`문장 속 '${x.word}'의 뜻을 고르세요.`,options:x.meanings,speak:x.word,extra:ex[1]});
 }));
 return out;
}
function spellingQs(){return DATA[lesson].words.map(x=>({id:`${x.id}:spell`,type:'spelling',w:x.w,m:x.m}))}
function reviewPool(){return [...allQs(),...spellingQs()]}
function allQs(){return [...wordQs(),...phraseQs(),...defQs(),...exprQs()]}
function pickSmart(pool,n){
 const misses=getMisses(),stats=getObject(keyStore("stats"));
 const ranked=shuffle(pool).sort((a,b)=>((misses[b.id]||0)-(misses[a.id]||0))||((stats[a.id]?.seen||0)-(stats[b.id]?.seen||0)));
 return ranked.slice(0,Math.min(n,ranked.length));
}
function startDaily(){
 const w=wordQs(),p=phraseQs(),d=defQs(),e=exprQs();
 let q=[...pickSmart(w.filter(x=>x.id.endsWith("a")),3),...pickSmart(w.filter(x=>x.id.endsWith("b")),2),...pickSmart(p,2),...pickSmart(d,2),...pickSmart(e,1)];
 begin(shuffle(q),"오늘의 10분");
}
function startMode(type){
 let pool=type==="words"?wordQs():type==="phrases"?phraseQs():type==="defs"?defQs():type==="expr"?exprQs():allQs();
 const n=type==="mixed"?20:Math.min(20,pool.length);
 begin(pickSmart(pool,n), type==="words"?"단어":type==="phrases"?"숙어":type==="defs"?"영영풀이":type==="expr"?"중요 표현":"시험형 믹스");
}
function startWrong(){
 const m=getMisses(),pool=reviewPool().filter(q=>m[q.id]);
 if(!pool.length){$("app").innerHTML=`<section class="card center"><div class="big">🎉</div><h2>현재 오답이 없어요!</h2><div class="controls"><button class="btn primary" onclick="home()">홈으로</button></div></section>`;return}
 begin(pickSmart(pool,Math.min(20,pool.length)),"오답 복습");
}
function begin(qs,title){cancelPending();sessionTitle=title;session=qs;qIndex=0;score=0;missedNow=[];timerReset();setProgress();renderQ(title)}
function fourOptions(q){let vals=[...new Set(q.options)].filter(x=>x!==q.answer);return shuffle([q.answer,...shuffle(vals).slice(0,3)])}
function renderQ(title=sessionTitle){
 answered=false;
 if(qIndex>=session.length)return finishSession(title);
 const q=session[qIndex];if(q.type==='spelling')return renderSpell();const opts=fourOptions(q);
 $("app").innerHTML=`<section class="card">
  <div class="topback"><span class="badge">${q.kind}</span><button class="btn ghost" onclick="home()">그만하기</button></div>
  <div class="question">${q.prompt}</div><div class="subq">${q.sub}</div>
  ${q.speak?`<div class="center"><button class="btn secondary" onclick="speak('${esc(q.speak)}')">🔊 발음 듣기</button></div>`:""}
  <div class="opts" style="margin-top:13px">${opts.map(o=>`<button class="opt" onclick="answerQ(this,'${esc(o)}','${esc(q.answer)}')">${o}</button>`).join("")}</div>
  <div id="feedback" class="feedback"></div>
  <div class="muted center">${qIndex+1} / ${session.length}</div>
 </section>`;
}
function answerQ(btn,chosen,answer){
 if(answered||!session[qIndex])return;answered=true;
 const q=session[qIndex];document.querySelectorAll(".opt").forEach(x=>x.disabled=true);
 const ok=chosen===answer,fb=$("feedback");
 if(ok){btn.classList.add("ok");fb.textContent="✅ 정답!";fb.className="feedback good";score++;addStars(1);healMiss(q.id);praise()}
 else{btn.classList.add("no");fb.textContent="정답: "+answer;fb.className="feedback bad";missedNow.push(q.id);saveMiss(q.id);document.querySelectorAll(".opt").forEach(x=>{if(x.textContent.trim()===answer)x.classList.add("ok")})}
 recordSeen(q.id,ok);qIndex++;setProgress();scheduleNext(()=>renderQ(),760)
}
function finishSession(title){
 clearInterval(tick);$("bar").style.width="100%";
 const pct=session.length?Math.round(score/session.length*100):0;
 $("app").innerHTML=`<section class="card center"><div style="font-size:58px">${pct>=80?"🏆":pct>=60?"⭐":"🌱"}</div><h2>${title} 완료!</h2><div class="big">${score}/${session.length}</div><p>${pct>=80?"오늘은 여기까지 해도 충분해요!":"틀린 것만 한 번 더 보면 기억이 더 오래가요."}</p><div class="controls">${missedNow.length?`<button class="btn secondary" onclick="startWrong()">틀린 것 다시 보기</button>`:""}<button class="btn primary" onclick="home()">홈으로</button></div></section>`
}
function startSpelling(){begin(pickSmart(spellingQs(),5),'철자 5개')}
function renderSpell(){
 answered=false;
 const q=session[qIndex];
 $("app").innerHTML=`<section class="card"><div class="topback"><span class="badge">철자 도전</span><button class="btn ghost" onclick="home()">그만하기</button></div><div class="question">${q.m}</div><div class="subq">영어 단어를 입력하세요.</div><input id="spellInput" class="input" autocomplete="off" autocapitalize="none"><div class="controls"><button id="spellConfirm" class="btn primary" onclick="checkSpell()">확인</button></div><div id="feedback" class="feedback"></div><div class="muted center">${qIndex+1}/${session.length}</div></section>`;
 $("spellInput").addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.isComposing)checkSpell()});$("spellInput").focus();
}
function checkSpell(){
 if(answered||!session[qIndex])return;answered=true;
 $("spellConfirm").disabled=true;$("spellInput").disabled=true;
 const q=session[qIndex],v=$("spellInput").value.trim().toLowerCase(),ok=v===q.w.toLowerCase(),fb=$("feedback");
 if(ok){fb.textContent="✅ 정답!";fb.className="feedback good";score++;addStars(2);healMiss(q.id);praise()}
 else{fb.textContent=`정답: ${q.w}`;fb.className="feedback bad";saveMiss(q.id);missedNow.push(q.id)}
 recordSeen(q.id,ok);qIndex++;setProgress();scheduleNext(()=>renderQ(),850);
}
function showList(){
 cancelPending();clearInterval(tick);
 const d=DATA[lesson];
 $("app").innerHTML=`<section class="card"><div class="listhead"><div><span class="badge">${d.title}</span><h2>전체 학습 목록</h2></div><button class="btn ghost" onclick="home()">홈으로</button></div><input id="search" class="search" placeholder="단어·뜻·숙어 검색" oninput="filterList()"><div id="listbody">${listHTML("")}</div></section>`
}
function listHTML(term){
 const d=DATA[lesson],t=term.toLowerCase(),match=(...xs)=>!t||xs.join(" ").toLowerCase().includes(t);
 const words=d.words.filter(x=>match(x.w,x.m,x.note));
 const phrases=d.phrases.filter(x=>match(x.w,x.m));
 const defs=d.definitions.filter(x=>match(x.w,x.d));
 const expr=d.expressions.filter(x=>match(x.w,x.m));
 const multis=d.multi.filter(x=>match(x.word,...x.meanings,...x.examples.flat()));
 return `<div class="section"><h3>🔤 단어 (${words.length})</h3>${words.map(x=>`<div class="item"><b onclick="speak('${esc(x.w)}')">🔊 ${x.w}</b> — ${x.m} <span class="note">${x.pos}${x.note?" · "+x.note:""}</span></div>`).join("")||"<div class='muted'>검색 결과 없음</div>"}</div>
 <div class="section"><h3>🧩 숙어 (${phrases.length})</h3>${phrases.map(x=>`<div class="item"><b>${x.w}</b> — ${x.m}</div>`).join("")}</div>
 <div class="section"><h3>📖 영영풀이 (${defs.length})</h3>${defs.map(x=>`<div class="item"><b>${x.w}</b><br><span class="muted">${x.d}</span></div>`).join("")}</div>
 ${expr.length?`<div class="section"><h3>🔥 중요 표현 (${expr.length})</h3>${expr.map(x=>`<div class="item"><b>${x.w}</b> — ${x.m}</div>`).join("")}</div>`:""}
 <div class="section"><h3>🎭 다의어·예문</h3>${multis.map(x=>`<div class="multi"><b>${x.word}</b> — ${x.meanings.join(" / ")}${x.examples.map(e=>`<div class="en">${e[0]}</div><div class="ko">${e[1]}</div>`).join("")}</div>`).join("")}</div>`
}
function filterList(){$("listbody").innerHTML=listHTML($("search").value)}
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("installBtn").style.display="inline-block"});
$("installBtn").addEventListener("click",async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("installBtn").style.display="none"}else alert("Android Chrome: 메뉴 → 앱 설치 / iPhone Safari: 공유 → 홈 화면에 추가")});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(error=>console.warn('오프라인 저장 기능 등록 실패',error));
for(const l of Object.keys(DATA))migrateRecords(l);
renderLessons();drawStats();home();
</script>
</body></html>
